name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  KRR_VERSION: ${{ github.event.release.tag_name || format('dev-{0}', github.sha) }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Bookworm's glibc 2.36 keeps the executable compatible with Ubuntu Noble.
    container:
      image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils
          python -m pip install --no-cache-dir -r requirements.txt pyinstaller==6.22.3

      - name: Set executable version
        shell: python
        run: |
          import os
          from pathlib import Path

          init = Path("robusta_krr/__init__.py")
          source = init.read_text()
          marker = '__version__ = "dev"'
          if source.count(marker) != 1:
              raise RuntimeError("Expected exactly one development version marker")
          init.write_text(source.replace(marker, f"__version__ = {os.environ['KRR_VERSION']!r}"))

      - name: Run tests, including CloudNativePG regressions
        run: python -m pytest -q --tb=short

      - name: Build executable
        run: |
          python -m PyInstaller --onefile --name krr-linux-amd64 \
            --collect-data grapheme --add-data intro.txt:. krr.py
          cd dist
          sha256sum krr-linux-amd64 > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: krr-linux-amd64
          path: |
            dist/krr-linux-amd64
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04', '26.10']
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: krr-linux-amd64
          path: dist

      - name: Check executable on Ubuntu ${{ matrix.ubuntu }}
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          chmod +x krr-linux-amd64
          docker run --rm --platform linux/amd64 --network none --user 1000:1000 \
            --env KRR_VERSION --env COLUMNS=160 --env TERM=dumb \
            --volume "$PWD:/artifacts:ro" "ubuntu:$UBUNTU_VERSION" sh -eu -c '
              getconf GNU_LIBC_VERSION
              /artifacts/krr-linux-amd64 version > /tmp/krr-version.txt
              cat /tmp/krr-version.txt
              grep -Fx -- "$KRR_VERSION" /tmp/krr-version.txt
              /artifacts/krr-linux-amd64 simple --help > /tmp/krr-help.txt
              grep -F CNPGCluster /tmp/krr-help.txt
            '

  upload-release:
    needs: [build, smoke-test]
    # Manual runs validate a build without modifying an existing release.
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: krr-linux-amd64
          path: dist

      - name: Attach verified executable and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          # Deliberately omit --clobber: never replace an existing release asset.
          gh release upload "$RELEASE_TAG" krr-linux-amd64 SHA256SUMS \
            --repo "$GITHUB_REPOSITORY"
